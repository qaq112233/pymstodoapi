version: '3.8'

services:
  mstodo-api:
    image: registry-vpc.cn-shanghai.aliyuncs.com/dockerad1z/pymstodoapi:v1
    container_name: mstodo-api-gateway
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Microsoft OAuth Configuration
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      
      # API Configuration
      - API_PREFIX=${API_PREFIX:-}
      - ENABLE_API_KEY=${ENABLE_API_KEY:-false}
      - X_API_KEY=${X_API_KEY:-}
      
      # Token Management
      - TOKEN_CACHE_PATH=/app/token_cache
      
      # Server Configuration
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      # Persist token cache across container restarts
      - token_cache:/app/token_cache
      # Mount .env file for application to read
      - ./.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Security: Run as non-root user (defined in Dockerfile)
    user: appuser

volumes:
  token_cache:
    driver: local
