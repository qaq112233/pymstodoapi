<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 1600px;
            height: 960px;
            background-color: #FFFFFF;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
            padding: 20px;
        }
        
        .timestamp {
            font-size: 12px;
            color: #666666;
            margin-bottom: 15px;
        }
        
        .task-list {
            width: 100%;
        }
        
        .task-item {
            width: 100%;
            padding: 15px 10px;
            border-bottom: 2px solid #000000;
            line-height: 1.6;
            font-size: 18px;
        }
        
        .task-item.starred {
            color: #FF0000;
            font-weight: bold;
        }
        
        .task-item.due-today {
            background-color: #FFE599;
            font-weight: bold;
        }
        
        .task-item.starred.due-today {
            background-color: #FFE599;
            color: #FF0000;
            font-weight: bold;
        }
        
        .task-title {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="timestamp">Generated at: {{ generated_at }} (UTC+8)</div>
    <div class="task-list">
        {% for task in tasks %}
        <div class="task-item {% if task.is_starred %}starred{% endif %} {% if task.is_due_today %}due-today{% endif %}">
            <div class="task-title">{{ task.title }}</div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
